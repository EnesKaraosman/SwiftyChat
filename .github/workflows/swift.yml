name: Swift

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Select latest stable Xcode
      run: |
        LATEST_XCODE=$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
        echo "Using $LATEST_XCODE"
        sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
        xcodebuild -version
        swift --version

    - name: Build (SPM)
      run: swift build

    - name: Test (SPM)
      run: swift test

    - name: Build demo (iOS)
      run: xcodebuild build -project SwiftyChatDemo/SwiftyChatDemo.xcodeproj -scheme SwiftyChatDemo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet

    - name: Build demo (macOS)
      run: xcodebuild build -project SwiftyChatDemo/SwiftyChatDemo.xcodeproj -scheme SwiftyChatDemo -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet

    - name: Build Documentation
      run: xcodebuild docbuild -scheme SwiftyChat -destination 'generic/platform=iOS Simulator' -quiet

  minimum-swift:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Test with Xcode 16.4
      run: swift test
      env:
        DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
