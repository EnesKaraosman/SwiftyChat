appId: com.eneskaraosman.SwiftyChatDemo
---
- launchApp
- tapOn: "Theme Showcase"
- assertVisible: "Modern"
- tapOn: "Choose theme"
- assertVisible: "Choose Theme"
- tapOn: "Dark Neon"
- assertVisible: "Dark Neon"
- tapOn: "Message..."
- inputText: "Theme smoke message"
- tapOn: "Arrow Up Circle"
- assertVisible: "Theme smoke message"
- tapOn: "Choose theme"
- tapOn: "Warm Sunset"
- assertVisible: "Theme: Warm Sunset"
- assertVisible: "Theme smoke message"
- tapOn: "Choose theme"
- tapOn: "Nature"
- assertVisible: "Theme: Nature"
- tapOn: "Choose theme"
- tapOn: "Classic"
- assertVisible: "Theme: Classic"
- tapOn: "Choose theme"
- tapOn: "Modern"
- assertVisible: "Theme: Modern"
- assertVisible: "Theme smoke message"
